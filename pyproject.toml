[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-vehicular-edge-computing"
version = "0.1.0"
description = "Risk-aware learning for computation offloading in vehicular edge networks"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Amir" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
